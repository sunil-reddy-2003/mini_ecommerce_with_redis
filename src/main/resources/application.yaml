spring:
  application:
    name: mini-ecommerce

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce-redis
    username: postgres
    password: 2003

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    cache-names: products
    redis:
      time-to-live: 10m
      cache-null-values: false